# Build Husk.ipa on a GitHub macOS runner.
#
# No signing secrets are needed: package_ipa.sh signs ad hoc, and AltStore /
# SideStore re-sign with your own Apple ID at install time.
#
# The first run compiles ANGLE and MoltenVK from scratch (about 12 minutes).
# Whatever got built is cached even if the run fails or times out -- the Rust
# pairing library's build and its crates included -- so later runs only build
# the app (about 1.5 minutes).
name: Build IPA

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Screenshots/**'
      - 'showcase/**'
      - 'research/**'

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # Husk is developed against the latest iOS SDK, and the WebKit ANGLE tree
      # it builds tracks the latest compiler, so use the newest stable Xcode.
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          echo "XCODE_ID=$(xcodebuild -version | awk '/Build version/{print $3}')" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          # xcodegen regenerates the project from project.yml; MoltenVK's
          # dependency build needs cmake (ninja makes it faster).
          brew install xcodegen cmake ninja
          rustup target add aarch64-apple-ios

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            third_party
            src/rppairing-ios/target
            ~/.cargo/registry
            ~/.cargo/git
          key: husk-tl-${{ env.XCODE_ID }}-${{ github.run_id }}
          restore-keys: husk-tl-${{ env.XCODE_ID }}-

      - name: Build
        timeout-minutes: 320
        run: ./scripts/ci_build.sh "$GITHUB_WORKSPACE/build/Husk.ipa"

      # Saved even when the build fails or times out, so progress is not lost.
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build
            third_party
            src/rppairing-ios/target
            ~/.cargo/registry
            ~/.cargo/git
          key: husk-tl-${{ env.XCODE_ID }}-${{ github.run_id }}

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs
          if-no-files-found: ignore

      # The Xcode project as xcodegen generated it from project.yml, so the
      # checked-in copy can be kept in step with it.
      - name: Upload generated project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodeproj
          path: src/app/Husk.xcodeproj/project.pbxproj
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa
          path: build/Husk.ipa
          if-no-files-found: error
